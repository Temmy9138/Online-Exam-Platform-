<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamPro Admin Sign Up</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background: linear-gradient(
        135deg,
        #213394,
        #4e5dcc
    );

    padding: 20px;
}


/* =========================
   SIGNUP CONTAINER
========================= */

.signup-container {

    width: 100%;

    max-width: 450px;

    background: white;

    padding: 35px;

    border-radius: 15px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.2);
}


/* =========================
   LOGO
========================= */

.logo {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #213394;

    margin-bottom: 10px;
}

.logo span {

    color: #6d7df5;
}


/* =========================
   TITLE
========================= */

.signup-title {

    text-align: center;

    margin-bottom: 25px;
}

.signup-title h2 {

    color: #222;

    margin-bottom: 8px;
}

.signup-title p {

    color: #777;

    font-size: 14px;
}


/* =========================
   FORM
========================= */

.form-group {

    margin-bottom: 17px;
}

.form-group label {

    display: block;

    font-size: 14px;

    font-weight: bold;

    color: #333;

    margin-bottom: 7px;
}

.form-group input {

    width: 100%;

    padding: 12px 14px;

    border: 1px solid #ddd;

    border-radius: 8px;

    outline: none;

    font-size: 15px;

    transition: 0.3s;
}

.form-group input:focus {

    border-color: #213394;

    box-shadow:
        0 0 0 3px rgba(33,51,148,0.1);
}


/* =========================
   PASSWORD BOX
========================= */

.password-box {

    position: relative;
}

.password-box input {

    padding-right: 50px;
}

.show-password {

    position: absolute;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    background: transparent;

    border: none;

    padding: 5px;

    cursor: pointer;

    font-size: 18px;

    color: #555;
}


/* =========================
   PASSWORD STRENGTH
========================= */

.password-strength {

    margin-top: 7px;

    font-size: 12px;

    color: #777;
}


/* =========================
   TERMS
========================= */

.terms {

    display: flex;

    align-items: flex-start;

    gap: 8px;

    margin: 18px 0;

    font-size: 13px;

    color: #666;
}

.terms input {

    margin-top: 3px;
}


/* =========================
   ERROR
========================= */

.error-message {

    display: none;

    background: #ffe8e8;

    color: #d00000;

    padding: 10px;

    border-radius: 7px;

    font-size: 13px;

    margin-bottom: 15px;

    text-align: center;
}


/* =========================
   SUCCESS
========================= */

.success-message {

    display: none;

    background: #e7f8ed;

    color: #16803c;

    padding: 10px;

    border-radius: 7px;

    font-size: 13px;

    margin-bottom: 15px;

    text-align: center;
}


/* =========================
   SIGNUP BUTTON
========================= */

.signup-btn {

    width: 100%;

    padding: 14px;

    background: #213394;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.signup-btn:hover {

    background: #172775;
}

.signup-btn:disabled {

    opacity: 0.7;

    cursor: not-allowed;
}


/* =========================
   LOGIN LINK
========================= */

.login-link {

    text-align: center;

    margin-top: 23px;

    padding-top: 20px;

    border-top: 1px solid #eee;

    font-size: 14px;

    color: #777;
}

.login-link a {

    color: #213394;

    font-weight: bold;

    text-decoration: none;
}

.login-link a:hover {

    text-decoration: underline;
}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    margin-top: 20px;

    color: #aaa;

    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    body {

        padding: 15px;
    }

    .signup-container {

        padding: 25px 20px;

        border-radius: 12px;
    }

    .logo {

        font-size: 26px;
    }

    .signup-title h2 {

        font-size: 21px;
    }

}

</style>

</head>


<body>


<!-- =========================
     SIGNUP CONTAINER
========================= -->

<div class="signup-container">


    <!-- LOGO -->

    <div class="logo">

        Exam<span>Pro</span>

    </div>


    <!-- TITLE -->

    <div class="signup-title">

        <h2>Admin Sign Up</h2>

        <p>
            Create your ExamPro administrator account.
        </p>

    </div>


    <!-- ERROR -->

    <div
        class="error-message"
        id="errorMessage">

    </div>


    <!-- SUCCESS -->

    <div
        class="success-message"
        id="successMessage">

    </div>


    <!-- FORM -->

    <form id="signupForm">


        <!-- FULL NAME -->

        <div class="form-group">

            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                maxlength="100"
                required
                autocomplete="name">

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                maxlength="254"
                required
                autocomplete="email">

        </div>


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Create a username"
                minlength="3"
                maxlength="40"
                pattern="[a-zA-Z0-9_.-]+"
                title="Use 3–40 letters, numbers, dots, underscores, or hyphens."
                required
                autocomplete="username">

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                    autocomplete="new-password">

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('password', this)">

                    👁️

                </button>

            </div>

            <div
                class="password-strength"
                id="passwordStrength">

                Password must be at least 6 characters.

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                    autocomplete="new-password">

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('confirmPassword', this)">

                    👁️

                </button>

            </div>

        </div>


        <!-- TERMS -->

        <label class="terms">

            <input
                type="checkbox"
                id="terms"
                required>

            <span>
                I agree to the Admin Terms and Conditions.
            </span>

        </label>


        <!-- BUTTON -->

        <button
            type="submit"
            class="signup-btn"
            id="signupBtn">

            Create Admin Account

        </button>


    </form>


    <!-- LOGIN -->

    <div class="login-link">

        Already have an admin account?

        <a
            href="adminlogin.html">

            Login

        </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 ExamPro. All Rights Reserved.

    </div>


</div>



<script>

/* =========================
   SHOW / HIDE PASSWORD
========================= */

function togglePassword(inputId, button) {

    const input =
        document.getElementById(inputId);


    if (input.type === "password") {

        input.type = "text";

        button.textContent = "🙈";

    } else {

        input.type = "password";

        button.textContent = "👁️";

    }

}


/* =========================
   PASSWORD STRENGTH
========================= */

document
    .getElementById("password")
    .addEventListener(
        "input",
        function() {

            const password = this.value;

            const strength =
                document.getElementById(
                    "passwordStrength"
                );


            if (password.length === 0) {

                strength.textContent =
                    "Password must be at least 6 characters.";

                return;
            }


            if (password.length < 6) {

                strength.textContent =
                    "Weak password";

            } else if (password.length < 10) {

                strength.textContent =
                    "Medium password";

            } else {

                strength.textContent =
                    "Strong password";

            }

        }
    );


/* =========================
   SIGNUP
========================= */

document
    .getElementById("signupForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const fullName =
                document
                .getElementById("fullName")
                .value
                .trim();


            const email =
                document
                .getElementById("email")
                .value
                .trim();


            const username =
                document
                .getElementById("username")
                .value
                .trim();


            const password =
                document
                .getElementById("password")
                .value;


            const confirmPassword =
                document
                .getElementById("confirmPassword")
                .value;


            const terms =
                document
                .getElementById("terms")
                .checked;


            const error =
                document
                .getElementById("errorMessage");


            const success =
                document
                .getElementById("successMessage");


            const button =
                document
                .getElementById("signupBtn");


            /* HIDE MESSAGES */

            error.style.display = "none";

            success.style.display = "none";


            /* REQUIRED FIELDS */

            if (
                !fullName ||
                !email ||
                !username ||
                !password ||
                !confirmPassword
            ) {

                error.textContent =
                    "Please fill in all fields.";

                error.style.display = "block";

                return;
            }


            /* EMAIL */

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (!emailPattern.test(email)) {

                error.textContent =
                    "Please enter a valid email address.";

                error.style.display = "block";

                return;
            }


            /* PASSWORD */

            if (password.length < 6) {

                error.textContent =
                    "Password must be at least 6 characters.";

                error.style.display = "block";

                return;
            }


            /* CONFIRM PASSWORD */

            if (password !== confirmPassword) {

                error.textContent =
                    "Passwords do not match.";

                error.style.display = "block";

                return;
            }


            /* TERMS */

            if (!terms) {

                error.textContent =
                    "Please accept the Terms and Conditions.";

                error.style.display = "block";

                return;
            }


            button.disabled = true;
            button.textContent =
                "Creating Account...";

            try {
                const response = await fetch("/api/admin/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        fullName,
                        email,
                        username,
                        password,
                        termsAccepted: terms
                    })
                });

                if (!response.headers.get("content-type")?.includes("application/json")) {
                    throw new Error(
                        "This page is not connected to the ExamPro server. Start it with npm start, then open this page using the host and port shown in the server output."
                    );
                }

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Could not create your account.");
                }

                success.textContent = result.message;
                success.style.display = "block";
                document.getElementById("signupForm").reset();

                setTimeout(function() {
                    window.location.href = "adminlogin.html";
                }, 1200);
            } catch (requestError) {
                error.textContent = requestError.message ||
                    "Cannot connect to the server. Make sure it is running and open this page through the server's host and port.";
                error.style.display = "block";
                button.disabled = false;
                button.textContent = "Create Admin Account";
            }

        }
    );

</script>

</body>
</html>
