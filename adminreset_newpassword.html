<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set New Password</title>
</head>
<body>
<h2>Set a new password</h2>
<form id="newForm">
<label>New password: <input type="password" id="newPassword" required minlength="6"></label><br>
<label>Confirm: <input type="password" id="confirmPassword" required minlength="6"></label><br>
<button type="submit">Save</button>
</form>
<div id="msg"></div>
<script>
document.getElementById('newForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('confirmPassword').value;
  const msg = document.getElementById('msg');
  msg.textContent = '';
  if (p1 !== p2) { msg.textContent = 'Passwords do not match.'; return; }
  const resetToken = localStorage.getItem('exampro_resetToken');
  if (!resetToken) { msg.textContent = 'Missing reset token. Start again.'; return; }
  try {
    const res = await fetch('/api/admin/password-reset/complete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({resetToken, newPassword: p1})});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not update password');
    msg.textContent = data.message || 'Password updated.';
    // clear local storage and redirect to login
    localStorage.removeItem('exampro_resetToken');
    localStorage.removeItem('exampro_resetEmail');
    setTimeout(()=> window.location.href='adminlogin.html', 1200);
  } catch (err) {
    msg.textContent = err.message || err;
  }
});
</script>
</body>
</html>
